<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arrow Launcher - Branding Assets</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #171513;
      color: #faf6ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 2px;
      color: #faf6ef;
    }
    p {
      color: #a39587;
      margin-top: 4px;
      font-size: 14px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      max-width: 1000px;
    }
    .card {
      background: #25211e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }
    .card h2 {
      font-size: 18px;
      margin: 16px 0 6px 0;
      color: #e56c50;
      letter-spacing: 1px;
    }
    .card span {
      font-size: 12px;
      color: #8c7e71;
    }
    .img-wrap {
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div>
    <h1>Arrow Launcher — Authentic Vector Branding</h1>
    <p>Handcrafted vector graphics designed directly from the game's minimal puzzle aesthetics.</p>
  </div>

  <div class="grid">
    <div class="card">
      <div class="img-wrap">
        <img src="logo.svg" alt="Game Logo">
      </div>
      <h2>Game Logo</h2>
      <span>Vector SVG • Scalable Branding • Editorial Typography</span>
    </div>

    <div class="card">
      <div class="img-wrap">
        <img src="icon.svg" alt="App Icon / DP">
      </div>
      <h2>Display Picture (DP / App Icon)</h2>
      <span>512x512 Squircle Badge • App Store & Profile Avatar</span>
    </div>
  </div>
</body>
</html>
